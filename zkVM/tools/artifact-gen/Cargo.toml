[package]
name = "aiken-artifact-gen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Generate flat artifacts from Aiken projects via aiken export"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
default = []
verus = []
