[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "guest"
path = "./src/main.rs"

[features]
guest = []
field-inline = ["jolt/field-inline"]

[dependencies]
jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt" }
jolt-inlines-sha2 = { git = "https://github.com/a16z/jolt", default-features = false }
uplc-guest = { path = "../../../uplc-guest", default-features = false }
num-bigint = { version = "0.4", default-features = false }
