[package]
name = "uplc-guest"
version = "0.1.0"
edition = "2021"
description = "Minimal no_std UPLC CEK evaluator for zkVM guests"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "uplc-eval"
path = "src/bin/uplc_eval.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["num-bigint/std", "num-traits/std", "sha2/std"]

[dependencies]
blake2 = { version = "0.10", default-features = false }
bls12_381 = { version = "0.9.0", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
group = { version = "0.14.0", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
