[package]
name = "nova"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Nova IVC folding CLI over BLS12-381 using arkworks"

[lib]
name = "nova"
path = "src/lib.rs"

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-prover = { path = "../../nova-prover" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
