[package]
name = "groth16"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Groth16 CLI over BLS12-381 using arkworks"

[lib]
name = "groth16"
path = "src/lib.rs"

[[bin]]
name = "groth16"
path = "src/main.rs"

[dependencies]
groth16-prover = { path = "../../groth16-prover" }
ark-bls12-381 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.8"
tempfile = "3"
