[package]
name = "lattice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lattice-based (post-quantum) IVC folding CLI — Lova prover"

[lib]
name = "lattice"
path = "src/lib.rs"

[[bin]]
name = "lattice"
path = "src/main.rs"

[[bin]]
name = "benchmark_lova"
path = "src/bin/benchmark_lova.rs"

[[bin]]
name = "benchmark_lova_r1cs"
path = "src/bin/benchmark_lova_r1cs.rs"

[dependencies]
lattice-prover = { path = "../../lattice-prover" }
lattirust-arithmetic = { git = "https://github.com/lattirust/lattirust.git", package = "lattirust-arithmetic" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
