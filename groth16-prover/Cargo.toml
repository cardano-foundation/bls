[package]
name = "groth16-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Groth16 prover over BLS12-381 using arkworks"

[features]
default = []
bins = ["trusted-setup/bins"]
privacy = ["dep:smt"]

[dependencies]
ark-bls12-381 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-poly = "0.4"
ark-serialize = "0.4"
ark-std = { version = "0.4", features = ["parallel"] }
nom = "7"
rand = "0.8"
rayon = "1.7"
smt = { path = "../clis/smt", optional = true }
trusted-setup = { path = "../clis/trusted-setup" }

[dev-dependencies]
ark-std = { version = "0.4", features = ["std"] }
proptest = "1.4"

[[bin]]
name = "print_proof_pippenger"
path = "src/bin/print_proof_pippenger.rs"
required-features = ["bins"]

[[bin]]
name = "benchmark_provers"
path = "src/bin/benchmark_provers.rs"
required-features = ["bins"]

[[bin]]
name = "benchmark_circom"
path = "src/bin/benchmark_circom.rs"
required-features = ["bins"]

[[bin]]
name = "benchmark_privacy"
path = "src/bin/benchmark_privacy.rs"
required-features = ["bins"]

[[bin]]
name = "benchmark_circom_full_pk"
path = "src/bin/benchmark_circom_full_pk.rs"
required-features = ["bins"]

[[bin]]
name = "benchmark_poseidon_merkle"
path = "src/bin/benchmark_poseidon_merkle.rs"
required-features = ["bins"]

[[bin]]
name = "compute_airdrop_inputs"
path = "src/bin/compute_airdrop_inputs.rs"
required-features = ["privacy"]
